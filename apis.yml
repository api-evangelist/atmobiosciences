aid: atmobiosciences

name: Atmobiosciences

description: Atmobiosciences (Atmo Biosciences) develops ingestible gas‑sensing capsules that measure gastrointestinal gases in real time. The
  Atmo Gas Capsule System provides clinicians with direct, localized data on gas production throughout the GI tract, enabling improved diagnosis
  and monitoring of motility disorders. The company’s platform integrates hardware, software, and data analytics to deliver actionable insights
  for research and clinical care.

